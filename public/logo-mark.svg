<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Transparent-background variant — for use inside custom containers. -->
  <!-- "S" — five nodes zig-zagging down the left half -->
  <path d="M20 18 L28 24 L20 30 L28 36 L20 42" stroke="#00E5FF" stroke-width="1.75" fill="none" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="18" r="2.75" fill="#00E5FF"/>
  <circle cx="28" cy="24" r="2.75" fill="#00E5FF"/>
  <circle cx="20" cy="30" r="2.75" fill="#00E5FF"/>
  <circle cx="28" cy="36" r="2.75" fill="#00E5FF"/>
  <circle cx="20" cy="42" r="2.75" fill="#00E5FF"/>

  <!-- "B" — vertical spine on the right with two outward loops -->
  <path d="M38 18 L38 42 M38 18 L46 24 L38 30 L46 36 L38 42" stroke="#00E5FF" stroke-width="1.75" fill="none" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="18" r="2.75" fill="#00E5FF"/>
  <circle cx="38" cy="30" r="2.75" fill="#00E5FF"/>
  <circle cx="38" cy="42" r="2.75" fill="#00E5FF"/>
  <circle cx="46" cy="24" r="2.75" fill="#00E5FF"/>
  <circle cx="46" cy="36" r="2.75" fill="#00E5FF"/>
</svg>
