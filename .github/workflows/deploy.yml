name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOARD_CHAT_ID: ${{ secrets.TELEGRAM_BOARD_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: ANTHROPIC_API_KEY,DATABASE_URL,SESSION_SECRET,RESEND_API_KEY,EMAIL_FROM,TELEGRAM_BOT_TOKEN,TELEGRAM_BOARD_CHAT_ID,TELEGRAM_WEBHOOK_SECRET,CRON_SECRET
          script: |
            cd /srv/salesbrain
            git pull origin production

            cat > .env.production << ENVEOF
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            DATABASE_URL=${DATABASE_URL}
            SESSION_SECRET=${SESSION_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM=${EMAIL_FROM}
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            TELEGRAM_BOARD_CHAT_ID=${TELEGRAM_BOARD_CHAT_ID}
            TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
            CRON_SECRET=${CRON_SECRET}
            ENVEOF

            npm install --production
            npm run build
            pm2 restart salesbrain || pm2 start ecosystem.config.cjs
