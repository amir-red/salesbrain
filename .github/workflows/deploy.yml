name: Deploy to Production

on:
  push:
    branches:
      - Production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOARD_CHAT_ID: ${{ secrets.TELEGRAM_BOARD_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          PUBLIC_FORM_BASE_URL: ${{ secrets.PUBLIC_FORM_BASE_URL }}
          ONBOARDING_API_KEY: ${{ secrets.ONBOARDING_API_KEY }}
          PUBLIC_FORM_ALLOWED_ORIGIN: ${{ secrets.PUBLIC_FORM_ALLOWED_ORIGIN }}
          CALENDLY_WEBHOOK_SECRET: ${{ secrets.CALENDLY_WEBHOOK_SECRET }}
          # Optional demo-email overrides (empty is fine — code has defaults)
          LEAD_NOTIFY_TO: ${{ secrets.LEAD_NOTIFY_TO }}
          LEAD_NOTIFY_CC: ${{ secrets.LEAD_NOTIFY_CC }}
          EMAIL_LOGO_URL: ${{ secrets.EMAIL_LOGO_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: ANTHROPIC_API_KEY,DATABASE_URL,SESSION_SECRET,RESEND_API_KEY,EMAIL_FROM,TELEGRAM_BOT_TOKEN,TELEGRAM_BOARD_CHAT_ID,TELEGRAM_WEBHOOK_SECRET,CRON_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,PUBLIC_FORM_BASE_URL,ONBOARDING_API_KEY,PUBLIC_FORM_ALLOWED_ORIGIN,CALENDLY_WEBHOOK_SECRET,LEAD_NOTIFY_TO,LEAD_NOTIFY_CC,EMAIL_LOGO_URL
          script: |
            set -e
            cd /srv/salesbrain
            git pull origin Production

            # Write env file (no leading spaces)
            printf '%s\n' \
              "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" \
              "DATABASE_URL=${DATABASE_URL}" \
              "SESSION_SECRET=${SESSION_SECRET}" \
              "RESEND_API_KEY=${RESEND_API_KEY}" \
              "EMAIL_FROM=${EMAIL_FROM}" \
              "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" \
              "TELEGRAM_BOARD_CHAT_ID=${TELEGRAM_BOARD_CHAT_ID}" \
              "TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}" \
              "CRON_SECRET=${CRON_SECRET}" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}" \
              "NEXT_PUBLIC_APP_URL=https://salescrm.chipchip.social" \
              "PUBLIC_FORM_BASE_URL=${PUBLIC_FORM_BASE_URL}" \
              "ONBOARDING_API_KEY=${ONBOARDING_API_KEY}" \
              "PUBLIC_FORM_ALLOWED_ORIGIN=${PUBLIC_FORM_ALLOWED_ORIGIN}" \
              "CALENDLY_WEBHOOK_SECRET=${CALENDLY_WEBHOOK_SECRET}" \
              "LEAD_NOTIFY_TO=${LEAD_NOTIFY_TO}" \
              "LEAD_NOTIFY_CC=${LEAD_NOTIFY_CC}" \
              "EMAIL_LOGO_URL=${EMAIL_LOGO_URL}" \
              > .env.production

            # Install all deps (including devDependencies for build)
            npm install

            # Build
            npm run build

            # Restart or start PM2
            pm2 restart salesbrain || pm2 start ecosystem.config.cjs
            pm2 save
