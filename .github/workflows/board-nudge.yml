name: Board vote nudge

# Post a fresh reminder to the board Telegram group at 11:00 EAT
# (= 08:00 UTC) on Monday, Wednesday, Friday. The route itself is
# throttled to 4h so a manual run right around the same time won't
# double-post.

on:
  schedule:
    - cron: '0 8 * * 1,3,5'   # 08:00 UTC Mon/Wed/Fri
  workflow_dispatch: {}         # allow manual runs from the Actions UI

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Ping board-nudge cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://salescrm.chipchip.social/api/cron/board-nudge
